name: Build and test previews
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .tools
          key: qt-6.12.0-${{ runner.os }}-${{ matrix.arch }}-v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libegl1-mesa-dev libgl1-mesa-dev libfontconfig1 libfreetype6 libdbus-1-3 libfuse2t64 xvfb
      - name: Python tools
        run: python -m pip install py7zr==1.1.4 Pillow==11.3.0
      - name: Install pinned Qt
        shell: bash
        run: |
          if [ ! -f .tools/qt/lib/cmake/Qt6/Qt6Config.cmake ]; then
            python scripts/download_qt.py --host ${{ matrix.platform }}
          fi
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        shell: bash
        run: |
          args=()
          if [ "${{ matrix.platform }}" = macos ]; then
            if [ "${{ matrix.arch }}" = arm64 ]; then args+=(-DCMAKE_OSX_ARCHITECTURES=arm64); else args+=(-DCMAKE_OSX_ARCHITECTURES=x86_64); fi
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/.tools/qt" "${args[@]}"
          cmake --build build --parallel 4
      - name: Core tests
        shell: bash
        run: |
          export PATH="$PWD/.tools/qt/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/.tools/qt/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build --output-on-failure
      - name: QML initialization (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QML_IMPORT_PATH="$PWD/.tools/qt/qml" QT_PLUGIN_PATH="$PWD/.tools/qt/plugins" ./build/GlassStats --qml-check --profile "$PWD/artifacts/qa/ci-profile"
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.401'
      - name: Sensor bridge (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Build-SensorBridge.ps1 -OutputDirectory build/sensor-bridge
      - name: Deploy Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH="$PWD\.tools\qt\bin;"+$env:PATH
          cmake --install build --prefix "$PWD/artifacts/GlassStats"
          & .tools/qt/bin/windeployqt.exe --release --qmldir qml --no-translations artifacts/GlassStats/GlassStats.exe
          Copy-Item build/sensor-bridge artifacts/GlassStats -Recurse
          python scripts/prepare_licenses.py --output artifacts/GlassStats/licenses/Qt --sources-output artifacts/corresponding-sources
          Compress-Archive -Path artifacts/GlassStats -DestinationPath artifacts/GlassStats-Qt-0.2.0-alpha.1-windows-x64-portable.zip
      - name: Package Linux/Mac preview
        if: runner.os != 'Windows'
        run: python scripts/package_unix.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GlassStats-Qt-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.sha256
            artifacts/qa/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: Qt-6.12.0-corresponding-sources
          path: artifacts/corresponding-sources/
